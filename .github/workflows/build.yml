name: Build Daraga ResponD Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor CLI
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Web Asset Directory
        run: |
          mkdir -p www
          cp -r public/* www/ 2>/dev/null || cp -r * www/ 2>/dev/null || true

      - name: Initialize Native Android Project
        run: |
          rm -f capacitor.config.json
          npx cap init "Daraga ResponD" "ph.gov.daraga.respond" --web-dir www
          npx cap add android

      - name: Compile Real Native Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Real Android APK
        uses: actions/upload-artifact@v4
        with:
          name: daraga-respond-real.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
