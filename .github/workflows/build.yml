name: Build Daraga ResponD Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r public/* www/ 2>/dev/null || true
          cp -r * www/ 2>/dev/null || true

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli @capacitor/core

      - name: Create Base Package Config
        run: |
          rm -f capacitor.config.json || true
          echo '{"appId":"ph.gov.daraga.respond","appName":"Daraga ResponD","webDir":"www"}' > capacitor.config.json

      - name: Add Android Platform
        run: |
          npm install @capacitor/core @capacitor/android
          npx cap add android || true
          npx cap sync android || true

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: daraga-respond.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
