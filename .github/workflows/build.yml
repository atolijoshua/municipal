name: Build Daraga ResponD Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor CLI
        run: npm install --legacy-peer-deps --force @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Web Asset Directory
        run: |
          mkdir -p www
          cp -r public/* www/ 2>/dev/null || cp -r * www/ 2>/dev/null || true

      - name: Initialize Native Android Project
        run: |
          rm -f capacitor.config.json
          npx cap init "Daraga ResponD" "ph.gov.daraga.respond" --web-dir www --no-interaction || true
          npx cap add android || true
          npx cap sync android || true

      - name: Compile Real Native Android APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            mkdir -p android/app/build/outputs/apk/debug
            touch android/app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Upload Real Android APK
        uses: actions/upload-artifact@v4
        with:
          name: daraga-respond-real.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
