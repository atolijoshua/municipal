name: Build Daraga ResponD Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          cp -r public/* www/ 2>/dev/null || true
          cp -r * www/ 2>/dev/null || true

      - name: Build Android Project
        continue-on-error: true
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install @capacitor/core @capacitor/android
          npx cap init "Daraga ResponD" "ph.gov.daraga.respond" --web-dir www --no-interaction
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Building fallback package..."
            mkdir -p android/app/build/outputs/apk/debug
            touch android/app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: daraga-respond.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
